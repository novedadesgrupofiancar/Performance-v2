<style>

<script>
'use strict';
// ============================================================================
// MODO: lo define la URL. ?admin=CLAVE -> el backend valida la clave.
// La clave NO se guarda en este archivo (se sube a GitHub Pages y es público).
// ============================================================================
const Q = new URLSearchParams(location.search);
const ADMIN_KEY = Q.get('admin') || '';
const ES_LOCAL = ['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0;
const MODO_MOCK = ES_LOCAL && Q.get('api') === 'mock';   // solo pruebas locales
const CACHE_KEY = 'perf_fiancar_cache_v1_' + (ADMIN_KEY ? 'admin' : 'equipo');

let RESP = null;
let MES = Q.get('mes') || null;
let TAB = 'ranking';
let MOCK = null;
const FORM = { fecha: hoyISO(), agente: null, tarea: true, llamadas: null, salientes: null };

const MAX = { leads: 30, pct: 25, own: 20, camp: 15, tmo: 10 };
const $ = (id) => document.getElementById(id);

// ============================================================================
// API
// ============================================================================
function backendConfigurado() { return MODO_MOCK || /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL); }

async function apiGet() {
  if (MODO_MOCK) return MOCK.get(ADMIN_KEY);
  const url = API_URL + '?t=' + Date.now() + (ADMIN_KEY ? '&admin=' + encodeURIComponent(ADMIN_KEY) : '');
  const r = await fetch(url, { redirect: 'follow' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function apiPost(accion, datos) {
  let res;
  if (MODO_MOCK) res = MOCK.post(ADMIN_KEY, accion, datos);
  else {
    // text/plain evita el preflight CORS que Apps Script no soporta.
    // Si la planilla no responde en 60 s, se corta con un error claro (nunca queda "cargando" para siempre).
    const corte = new AbortController();
    const reloj = setTimeout(() => corte.abort(), 60000);
    let r;
    try {
      r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: ADMIN_KEY, accion: accion, datos: datos }), signal: corte.signal });
    } catch (e) {
      throw new Error(e.name === 'AbortError' ? 'la planilla no respondió en 60 segundos. Probá de nuevo.' : 'no hay conexión con la planilla (' + e.message + '). Si usás Brave, desactivá Shields para esta página.');
    } finally { clearTimeout(reloj); }
    try { res = await r.json(); } catch (e) { throw new Error('la planilla respondió algo inesperado (HTTP ' + r.status + ').'); }
  }
  if (!res.ok && !res.confirmar) throw new Error(res.error || 'Error desconocido');
  return res;
}

async function cargarMock() {
  const carga = (src) => new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
  await carga('pruebas/mock-gas.js');
  await carga('pruebas/datos-demo.js');
  const codigo = await (await fetch('backend/Codigo.gs?t=' + Date.now())).text();
  MOCK = window.crearBackendDemo(codigo, Q.get('vacio') === '1');
}

// ============================================================================
// ARRANQUE
// ============================================================================
async function iniciar() {
  if (!backendConfigurado()) {
    $('chipSync').textContent = 'Sin backend';
    $('chipSync').className = 'chip err';
    $('main').innerHTML = '<div class="vacio"><b>Falta conectar la planilla</b>Pegá la URL del Apps Script en la constante <span class="mono">API_URL</span> al principio de <span class="mono">index.html</span>.<br>Paso a paso en <span class="mono">docs/INSTALACION.md</span>.</div>';
    return;
  }
  // Caché de lectura: pinta al instante lo último que se vio, mientras llega el backend.
  try {
    const c = localStorage.getItem(CACHE_KEY);
    if (c && !MODO_MOCK) { RESP = JSON.parse(c); elegirMes(); render(); setSync('Copia guardada · actualizando…', 'warn'); }
  } catch (e) {}
  try {
    if (MODO_MOCK) await cargarMock();
    await refrescar();
  } catch (e) {
    console.error(e);
    if (RESP) setSync('Sin conexión · mostrando copia guardada', 'err');
    else {
      setSync('Sin conexión', 'err');
      $('main').innerHTML = '<div class="vacio"><b>No se pudo leer la planilla</b>' + esc(e.message) + '<br>Revisá la conexión o la URL del Apps Script.</div>';
    }
  }
}

async function refrescar() {
  const r = await apiGet();
  if (!r.ok) throw new Error(r.error || 'Respuesta inválida del backend');
  RESP = r;
  try { if (!MODO_MOCK) localStorage.setItem(CACHE_KEY, JSON.stringify(r)); } catch (e) {}
  elegirMes();
  // En Carga de datos, en cuanto el mes de carga tiene datos, el selector de arriba lo muestra.
  if (TAB === 'carga' && CARGA_MES && RESP.datos[CARGA_MES]) MES = CARGA_MES;
  render();
  setSync('Actualizado ' + horaCorta(r.generado), '');
}

function elegirMes() {
  if (!RESP) return;
  // Cada mes es una "misión": Octubre 2026 -> Misión Octubre 2026.
  (RESP.meses || []).forEach((m) => { if (m.etiqueta && m.etiqueta.indexOf('Misión ') !== 0) m.etiqueta = 'Misión ' + m.etiqueta; });
  if (!MES || !RESP.datos[MES]) MES = RESP.mesMostrado || (RESP.meses[0] && RESP.meses[0].mes) || null;
}

function esAdmin() { return !!(RESP && RESP.esAdmin); }

// ============================================================================
// RENDER GENERAL
// ============================================================================
function render() {
  const admin = esAdmin();
  $('chipRol').hidden = !admin;
  $('btnPng').hidden = !admin || !MES;
  // Selector de mes
  const sel = $('selMes');
  sel.hidden = !RESP.meses.length;
  sel.innerHTML = RESP.meses.map((m) => '<option value="' + m.mes + '"' + (m.mes === MES ? ' selected' : '') + '>' +
    esc(m.etiqueta) + (admin && !m.publicado ? ' · borrador' : '') + '</option>').join('');
  // Pestañas
  const tabs = [['ranking', 'Ranking'], ['especiales', 'Evaluación especial'], ['puntaje', 'Cómo se calcula']];
  if (admin) { tabs.splice(1, 0, ['control', 'Control de leads']); tabs.push(['carga', 'Carga de datos']); }
  if (!tabs.some((t) => t[0] === TAB)) TAB = 'ranking';
  $('tabs').innerHTML = tabs.map((t) => '<button class="tab' + (t[0] === TAB ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('');

  let html = bannerAdmin();
  if (!MES && TAB !== 'puntaje' && TAB !== 'carga' && TAB !== 'control') {
    html += '<div class="vacio"><b>Todavía no hay meses publicados</b>Cuando el coordinador publique el mes, lo vas a ver acá.</div>';
  } else if (TAB === 'ranking') html += vistaRanking();
  else if (TAB === 'especiales') html += vistaEspeciales();
  else if (TAB === 'puntaje') html += vistaPuntaje();
  else if (TAB === 'carga') html += vistaCarga();
  else if (TAB === 'control') html += vistaControl();
  $('main').innerHTML = html;

  if (TAB === 'control') prepararControl();

  $('pie').textContent = 'Datos: planilla de Google · ' + (admin ? 'modo admin' : 'modo equipo (solo lectura)') + (MODO_MOCK ? ' · BACKEND DE PRUEBA' : '');
}

// ESTILO VIDEOJUEGO: avatares pixelados, barras por bloques, EXP y nivel
// ============================================================================
const COLOR_CMP = { leads: 'var(--c-leads)', pct: 'var(--c-pct)', own: 'var(--c-own)', camp: 'var(--c-camp)', tmo: 'var(--c-tmo)' };

/** Nivel según la EXP (el puntaje total sobre 100). */
function nivel(exp) {
  if (exp === null || exp === undefined) return { txt: 'LVL —', cls: 'lvl-0' };
  if (exp >= 100) return { txt: 'LVL DIOS', cls: 'lvl-dios' };
  if (exp >= 90) return { txt: 'LVL 5', cls: 'lvl-5' };
  if (exp >= 85) return { txt: 'LVL 4', cls: 'lvl-4' };
  if (exp >= 80) return { txt: 'LVL 3', cls: 'lvl-3' };
  if (exp >= 75) return { txt: 'LVL 2', cls: 'lvl-2' };
  if (exp >= 65) return { txt: 'LVL 1', cls: 'lvl-1' };
  return { txt: 'LVL 0', cls: 'lvl-0' };
}
function lvlHtml(exp) { const n = nivel(exp); return '<span class="lvl ' + n.cls + '" title="Nivel según la EXP: 65 LVL 1 · 75 LVL 2 · 80 LVL 3 · 85 LVL 4 · 90 LVL 5 · 100 LVL DIOS">' + n.txt + '</span>'; }

/** Barra de 10 bloques, del color del componente. */
function bloques(pts, max, color) {
  const on = Math.max(0, Math.min(10, Math.round((pts || 0) / max * 10)));
  let h = '<div class="bloques" aria-hidden="true">';
  for (let i = 0; i < 10; i++) h += '<i' + (i < on ? ' style="background:' + color + '"' : '') + '></i>';
  return h + '</div>';
}

// Rasgos de cada avatar (pelo: corto / larguito / largo; barba; lentes).
const AVATARES = {
  'Alvaro Cuello':    { pelo: '#6b4423', largo: 'corto', barba: true,  remera: '#3fa66b' },
  'Melanie Barrero':  { pelo: '#17171c', largo: 'largo', piel: '#f6dcc7', remera: '#4f8fd9' },
  'Damian Chmiel':    { pelo: '#17171c', largo: 'larguito', remera: '#d98a3f' },
  'Sabrina Lapaz':    { pelo: '#17171c', largo: 'largo', lentes: true, remera: '#d9566b' },
  'Gianine Pereda':   { pelo: '#4a2e1f', largo: 'largo', lentes: true, remera: '#3fb5a6' },
  'Natasha Piriz':    { pelo: '#8b5a3c', largo: 'largo', remera: '#9b6bd9' },
  'Piero Paganini':   { pelo: '#2b2420', largo: 'corto', remera: '#5a7fa6' },
  'Shoanna Silveira': { pelo: '#3a2418', largo: 'largo', remera: '#c97ab0' }
};

/** Avatar pixelado de 12×12 dibujado en SVG (sin imágenes externas). */
function avatar(nombre, tam) {
  const a = AVATARES[nombre] || { pelo: '#3a3a44', largo: 'corto', remera: '#5a6478' };
  const piel = a.piel || '#e3b58f', ojo = '#1b1b24', p = [];
  const px = (x, y, c) => p.push('<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c + '"/>');
  // pelo largo: por detrás de la cara
  if (a.largo === 'largo') for (let y = 3; y < 10; y++) { px(2, y, a.pelo); px(9, y, a.pelo); }
  // cara
  for (let x = 3; x < 9; x++) for (let y = 3; y < 8; y++) px(x, y, piel);
  // pelo de arriba
  for (let x = 3; x < 9; x++) px(x, 1, a.pelo);
  for (let x = 2; x < 10; x++) px(x, 2, a.pelo);
  px(2, 3, a.pelo); px(9, 3, a.pelo);
  if (a.largo === 'larguito') for (let y = 3; y < 7; y++) { px(2, y, a.pelo); px(9, y, a.pelo); }
  if (a.largo !== 'corto') { px(3, 3, a.pelo); px(8, 3, a.pelo); }
  // ojos o lentes
  if (a.lentes) { ['#2a2a35', '#a9d6e5', '#2a2a35', '#2a2a35', '#a9d6e5', '#2a2a35'].forEach((c, i) => px(3 + i, 5, c)); }
  else { px(4, 5, ojo); px(7, 5, ojo); }
  // boca y barba
  if (a.barba) { for (let x = 3; x < 9; x++) px(x, 7, a.pelo); px(3, 6, a.pelo); px(8, 6, a.pelo); px(5, 7, '#b5705c'); px(6, 7, '#b5705c'); }
  else { px(5, 7, '#c9806b'); px(6, 7, '#c9806b'); }
  // cuello y remera
  for (let x = 5; x < 7; x++) px(x, 8, piel);
  for (let x = 2; x < 10; x++) for (let y = 9; y < 12; y++) px(x, y, a.remera);
  return '<svg class="avatar" viewBox="0 0 12 12" width="' + (tam || 40) + '" height="' + (tam || 40) + '" shape-rendering="crispEdges" role="img" aria-label="Avatar de ' + esc(nombre) + '">' + p.join('') + '</svg>';
}

function tile(l, v, s, cls) {
  return '<div class="tile"><div class="l">' + l + '</div><div class="v ' + (cls || '') + '">' + v + '</div><div class="s">' + s + '</div></div>';
}

function cmp(lbl, pts, max, metrica, sinDatos, color) {
  return '<div class="cmp"><span class="lbl">' + lbl + '</span><div class="n' + (sinDatos ? ' sindatos' : '') + '">' + fmt(pts) + '</div>' +
    '<div class="m">' + metrica + '</div>' + bloques(pts, max, color || 'var(--accent)') + '</div>';
}

function filaRanking(a) {
  const L = a.leads, O = a.ownership, C = a.llamadas, K = a.campanas;
  const mLeads = L.sinDatos ? 'sin datos' : fmt(L.promedio, 2) + '/10 · ' + L.diasConDatos + 'd';
  const mPct = C.pct === null ? 'sin datos' : fmt(C.pct) + '%';
  const mOwn = O.sinDatos ? 'sin datos' : O.diasAlDia + '/' + O.diasCargados + ' días';
  const mCamp = K.recepcion ? 'Recepción' : K.ganadas + ' gan. · ' + K.puesto + '°' + (K.bonus ? ' · +' + K.bonus : '');
  const mTmo = C.tmo === null ? 'sin datos' : C.tmoTxt + (C.alertaTmo ? ' <span class="alerta" title="TMO menor a 1:30">⚠</span>' : '');
  return '<div class="rk-row body' + (a.puesto === 1 ? ' p1' : '') + '" data-ficha="' + esc(a.nombre) + '">' +
    '<div class="pos' + (a.puesto === 1 ? ' p1' : '') + '">' + a.puesto + '</div>' +
    '<div class="ag">' + avatar(a.nombre, 42) + '<div><b>' + esc(a.nombre) + '</b><span>' + a.ext + ' · ' + esc(a.tarea) + '</span></div></div>' +
    '<div class="cmps">' +
    cmp('Leads', L.pts, MAX.leads, mLeads, L.sinDatos, COLOR_CMP.leads) +
    cmp('% Atend', C.ptsPct, MAX.pct, mPct, C.pct === null, COLOR_CMP.pct) +
    cmp('Owner', O.pts, MAX.own, mOwn, O.sinDatos, COLOR_CMP.own) +
    cmp('Camp.', K.pts, MAX.camp, mCamp, false, COLOR_CMP.camp) +
    cmp('TMO', C.ptsTmo, MAX.tmo, mTmo, C.tmo === null, COLOR_CMP.tmo) +
    '</div>' +
    '<div class="tot"><span class="exp c-' + a.semaforo + '">' + fmt(a.total) + '</span><span class="exp-l">EXP</span><br>' + lvlHtml(a.total) + '</div>' +
    '</div>';
}

function cerrarFicha() { $('capaModal').innerHTML = ''; document.body.style.overflow = ''; }

function desg(nombre, detalle, pts, max, color) {
  return '<div class="desg-row"><div class="nm">' + nombre + '<small>' + detalle + '</small></div>' +
    bloques(pts, max, color || 'var(--accent)') +
    '<div class="pt">' + fmt(pts) + '<small>/' + max + '</small></div></div>';
}

function graficoTmo(a, dm) {
  const lista = dm.agentes.filter((x) => x.llamadas.tmo !== null).slice().sort((x, y) => x.llamadas.tmo - y.llamadas.tmo);
  if (!lista.length || a.llamadas.tmo === null) return '<p class="nota">Sin datos de TMO este mes.</p>';
  const tope = Math.max(240, Math.max.apply(null, lista.map((x) => x.llamadas.tmo)) + 15);
  const pos = (s) => (s / tope * 100) + '%';
  let h = '<div class="tmo-ch">';
  lista.forEach((x) => {

/**
 * Grilla del mes: qué días se cargaron y el puntaje de leads de cada agente por día.
 * Sale de la pestaña `leads` (lo guardado por el control o a mano), así que coincide con el Ranking.
 */
function grillaMesLeads() {
  const mes = CONTROL.fecha.slice(0, 7);
  const dm = RESP.datos[mes];
  const etiqueta = etiquetaDe(mes);
  const hoy = hoyISO();
  // Días hábiles del mes (lunes a viernes) hasta hoy.
  const dias = [];
  const p = mes.split('-').map(Number);
  for (let d = 1; d <= 31; d++) {
    const f = new Date(p[0], p[1] - 1, d);
    if (f.getMonth() !== p[1] - 1) break;
    const iso = mes + '-' + String(d).padStart(2, '0');
    if (iso > hoy) break;
    if (f.getDay() !== 0 && f.getDay() !== 6) dias.push(iso);
  }
  let h = '<div class="h-sec">Días cargados · ' + esc(etiqueta) + '</div>';
  if (!dm || !dm.agentes || !dias.length) return h + '<div class="card"><p class="nota">Todavía no hay días cargados en ' + esc(etiqueta) + '.</p></div>';
  const porAgente = {};
  dm.agentes.forEach((a) => { porAgente[a.nombre] = {}; a.leads.dias.forEach((d) => { porAgente[a.nombre][d.fecha] = d; }); });
  const cargados = dias.filter((f) => dm.agentes.some((a) => porAgente[a.nombre][f]));
  const faltan = dias.filter((f) => cargados.indexOf(f) < 0);
  h += '<div class="card"><div class="nota" style="margin-bottom:10px"><b>' + cargados.length + ' de ' + dias.length + '</b> días hábiles cargados hasta hoy' +
    (faltan.length ? ' · <span class="c-amarillo">faltan: ' + faltan.map(fechaCorta).join(', ') + '</span>' : ' · <span class="c-verde">no falta ninguno</span>') +
    '. Tocá un día para controlarlo.</div><div class="scroll"><table class="t grilla"><thead><tr><th>Agente</th>' +
    dias.map((f) => '<th class="r"><button class="dia' + (f === CONTROL.fecha ? ' on' : '') + '" data-dia="' + f + '" title="Controlar el ' + fechaCorta(f) + '">' + Number(f.slice(8)) + '</button></th>').join('') +
    '<th class="r">Leads /30</th></tr></thead><tbody>' +
    dm.agentes.slice().sort((x, y) => x.nombre.localeCompare(y.nombre)).map((a) => '<tr><td class="txt">' + esc(a.nombre) + '</td>' +
      dias.map((f) => {
        const d = porAgente[a.nombre][f];
        if (!d) return '<td class="r muted" title="Sin cargar">—</td>';
        if (d.score === null) return '<td class="r muted" title="Cargado, sin leads">s/l</td>';
        const col = d.score >= 8 ? 'c-verde' : d.score >= 6.6 ? 'c-amarillo' : 'c-rojo';
        return '<td class="r ' + col + '" title="' + d.totales + ' leads · ' + d.sinGestionar + ' sin gestionar · ' + d.errores + ' errores · tarea ' + (d.tarea ? 'SI' : 'NO') + '">' + fmt(d.score, 1) + '</td>';
      }).join('') +
      '<td class="r"><b>' + (a.leads.sinDatos ? '—' : fmt(a.leads.pts)) + '</b></td></tr>').join('') +
    '</tbody></table></div><p class="nota" style="margin-top:8px">— sin cargar · s/l cargado sin leads · el número es el puntaje del día (0 a 10). Leads /30 es lo que suma en el Ranking.</p></div>';
  return h;
}

function prepararControl() {
  $('ctlFecha').addEventListener('change', (ev) => {
    CONTROL.fecha = ev.target.value;
    if (CONTROL.textos.length) leerControl(); else render();
  });
  $('ctlArchivo').addEventListener('change', (ev) => {
    // Se pueden elegir los dos archivos juntos (varios exports de Vtiger).
    const files = Array.from(ev.target.files);
    if (!files.length) return;
    Promise.all(files.map((f) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsText(f, 'UTF-8'); })))
      .then((textos) => {
        CONTROL.textos = [unirCsvs(textos)]; CONTROL.archivo = files.map((f) => f.name).join(' + ');
        // Export de la lista: el día sale del archivo (fecha de creación). Si casi todos los leads son de un mismo día, se usa ese.
        const dias = CONTROL.formato.dias, total = Object.keys(dias).reduce((s, k) => s + dias[k], 0);
        const top = Object.keys(dias).sort((x, y) => dias[y] - dias[x])[0];
        if (top && dias[top] >= total * 0.8 && diasHabilesDelArchivo().length <= 1 && top !== CONTROL.fecha && (!RESP.primerMes || top.slice(0, 7) >= RESP.primerMes)) { CONTROL.formato.fechaAuto = CONTROL.fecha; CONTROL.fecha = top; }
        leerControl();
      })
      .catch(() => toast('No se pudieron leer los archivos', true));
    ev.target.value = '';
  });
  document.querySelectorAll('[data-tarea]').forEach((seg) => seg.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    CONTROL.tareas[seg.dataset.tarea] = b.dataset.v === '1';
    CONTROL.guardado = false;
    render();
  }));
  document.querySelectorAll('[data-copiar]').forEach((b) => b.addEventListener('click', () => {
    const a = CONTROL.res.agentes.filter((x) => x.nombre === b.dataset.copiar)[0];
    copiarTexto(a.mensaje);
  }));
  const g = $('ctlGuardar');
  if (g) g.addEventListener('click', guardarControl);
  const gm = $('ctlGuardarMulti');
  if (gm) gm.addEventListener('click', guardarVariosDias);
  // Tocar un día de la grilla lo elige como "Día del control" (hay que importar el export de ese día).
  document.querySelectorAll('[data-dia]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.dia === CONTROL.fecha) return;
    Object.assign(CONTROL, { fecha: b.dataset.dia, textos: [], archivo: '', res: null, tareas: {}, guardado: false, estado: 'vacio', error: '' });
    render();
    window.scrollTo(0, 0);
  }));
}

// ---- Export "de la lista" de Vtiger (solo las columnas visibles, nombres completos, fechas "01-10-2026 4:28 PM").
// Se traduce al formato del export completo para que el Apps Script lo entienda igual.
const VT_AGENTES = { 'alvaro cuello': 'alvcue', 'sabrina lapaz': 'slapaz', 'damian chmiel': 'damchm', 'melanie barrero': 'melbar', 'gianine pereda': 'gpereda', 'natasha piria': 'natpir', 'natasha piriz': 'natpir' };
const VT_NO_VENDEDORES = { 'carolina martinez': 'carmar', 'piero paganini': 'piepag' };
// Usuarios que no son vendedores sin código conocido, y grupos: quedan con espacios y el Apps Script los marca "Mal derivado".
const VT_NO_VEND_NOMBRES = ['macarena martinez', 'macarena nunez', 'ana paula', 'angeles'];
const VT_GRUPO = /\b(ventas|ecom|cc|fiancar|grupo|equipo|call ?center)\b/i;

function fechaVtigerISO(s) {
  const m = String(s || '').trim().match(/^(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AP]M)?)?/i);
  if (!m) return s;
  let h = Number(m[4] || 0);
  if (m[7]) { const pm = m[7].toUpperCase() === 'PM'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
  return m[3] + '-' + m[2] + '-' + m[1] + ' ' + String(h).padStart(2, '0') + ':' + (m[5] || '00') + ':' + (m[6] || '00');
}

function usuarioVtiger(nombre) {
  const n = sinTildes(nombre);
  if (!n) return nombre;
  if (VT_AGENTES[n]) return VT_AGENTES[n];
  if (VT_NO_VENDEDORES[n]) return VT_NO_VENDEDORES[n];
  if (VT_GRUPO.test(n) || VT_NO_VEND_NOMBRES.some((x) => n.indexOf(x) === 0)) return nombre;   // con espacios = no vendedor
  return String(nombre).trim().replace(/\s+/g, '_');   // vendedor (persona): sin espacios
}

/** Si la fila viene del export de la lista, la completa al formato del export completo. */
function adaptarFilaLista(o, info) {
  if ('Fecha de Asignado' in o && 'Fecha de Modificación' in o) return o;
  info.formatoLista = true;
  const creacion = fechaVtigerISO(o['Fecha de Creación']);
  const dia = String(creacion).slice(0, 10);
  if (/^\d{4}-\d{2}-\d{2}$/.test(dia)) info.dias[dia] = (info.dias[dia] || 0) + 1;
  const cod = VT_AGENTES[sinTildes(o['Derivado por'])];
  if (cod) info.derivan[NOMBRE_DE_CODIGO[cod]] = true;
  o['Fecha de Creación'] = creacion;
  o['Asignado a'] = usuarioVtiger(o['Asignado a']);
  // Sin fechas de asignación/modificación: el día de referencia es el de creación del lead.
  o['Fecha de Asignado'] = creacion;
  o['Fecha de Modificación'] = creacion;
  // Sin "Fecha último comentario" no se puede auditar: se marca como "con comentario" y se avisa en pantalla.
  if (!('Fecha último comentario' in o)) { o['Fecha último comentario'] = 'sin dato'; info.sinComentarios = true; }
  return o;
}

/** Junta varios CSV de Vtiger en uno (por nombre de columna), saca los leads repetidos y adapta el export de la lista. */
function unirCsvs(textos) {
  CONTROL.formato = { formatoLista: false, sinComentarios: false, dias: {}, fechaAuto: '', derivan: {} };
  const partir = (texto) => {
    if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
    // Archivo guardado con la codificación equivocada ("CreaciÃ³n"): se corrige.
    if (/Ã[\u0080-\u00bf]/.test(texto)) { try { texto = decodeURIComponent(escape(texto)); } catch (e) {} }
    const fin = texto.indexOf('\n'), primera = fin < 0 ? texto : texto.slice(0, fin);
    const sep = primera.split(';').length > primera.split(',').length ? ';' : ',';   // Excel en español guarda con ";"
    // Vtiger a veces deja una comilla sin cerrar al cortar una descripción con "...". Para que una fila rota
    // no desordene las siguientes, se separa primero por registro (cada registro arranca con "valor","...)
    // y se lee cada uno por separado.
    const inicio = new RegExp('^"[^"]*"\\s*' + (sep === ';' ? ';' : ',') + '\\s*"');
    const registros = [];
    texto.split(/\r?\n/).forEach((l) => {
      if (!registros.length || inicio.test(l)) registros.push(l); else registros[registros.length - 1] += '\n' + l;
    });
    const leerRegistro = (s) => {
      const fila = []; let cur = '', q = false;
      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        if (q) { if (ch === '"' && s[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
        else if (ch === '"') q = true;
        else if (ch === sep) { fila.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      fila.push(cur.trim());
      return fila;
    };
    return registros.map(leerRegistro).filter((f) => f.some((c) => c !== ''));
  };
  // Nombres de columna exactos que usa el control (se aceptan con o sin tildes / mayúsculas).
  const canon = {};
  ['Asignado a', 'Fase de Venta', 'Fecha de Creación', 'Derivado por', 'Suborigen', 'Número Lead', 'Nombre Lead', 'Nombre De Contacto',
    'Fecha de Asignado', 'Fecha de Tomada', 'Fecha último comentario', 'Comentario', 'Fecha de Modificación'].forEach((c) => { canon[sinTildes(c).replace(/[^a-z]/g, '')] = c; });
  const nombreCol = (h) => canon[sinTildes(h).replace(/[^a-z]/g, '')] || h;
  const columnas = [], filas = [], vistos = {};
  const agregarCol = (h) => { if (columnas.indexOf(h) < 0) columnas.push(h); };
  textos.forEach((t) => {
    const f = partir(t);
    const enc = (f[0] || []).map(nombreCol);
    enc.forEach(agregarCol);
    f.slice(1).forEach((r) => {
      let obj = {}; enc.forEach((h, i) => { obj[h] = r[i] || ''; });
      obj = adaptarFilaLista(obj, CONTROL.formato);
      Object.keys(obj).forEach(agregarCol);
      const k = obj['Número Lead'] || null;
      if (k && vistos[k] !== undefined) filas[vistos[k]] = obj; else { if (k) vistos[k] = filas.length; filas.push(obj); }
    });
  });
  const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  return [columnas.map(q).join(',')].concat(filas.map((o) => columnas.map((c) => q(o[c] || '')).join(','))).join('\n');
}

function ahoraControl() {
  // Si el control es de hoy, el backend usa la hora actual; si es de otro día, se calcula al cierre (18:00).
  return CONTROL.fecha === hoyISO() ? undefined : CONTROL.fecha + ' 18:00';
}

function diasHabilesDelArchivo() {

  return dias.filter((d) => { const p = d.split('-').map(Number); const w = new Date(p[0], p[1] - 1, p[2]).getDay(); return w !== 0 && w !== 6 && (!RESP.primerMes || d.slice(0, 7) >= RESP.primerMes) && d <= hoyISO(); });
}

async function leerVariosDias(dias) {
  CONTROL.multi = { dias: dias, res: {}, progreso: '' };
  for (let i = 0; i < dias.length; i++) {
    CONTROL.multi.progreso = 'Calculando ' + fechaCorta(dias[i]) + ' (' + (i + 1) + ' de ' + dias.length + ')…';

function agentesDelArchivo() {
  const set = {};

async function guardarVariosDias() {
  const m = CONTROL.multi, ags = agentesDelArchivo();
  const btn = $('ctlGuardarMulti');
  btn.disabled = true;
  const tareas = [];
  m.dias.forEach((d) => ags.forEach((n) => {
    const a = m.res[d].agentes.filter((x) => x.nombre === n)[0];
    const prev = leadExistente(d, n);
    tareas.push({ fecha: d, agente: n, totales: a.totales, sinGestionar: a.sinGestionarTotal, errores: a.errores,
      tareaAlDia: prev && (prev.tarea === true || prev.tarea === false) ? prev.tarea : true });
  }));
  try {
    for (let i = 0; i < tareas.length; i += 4) {
      btn.textContent = 'Guardando ' + Math.min(i + 4, tareas.length) + ' de ' + tareas.length + '…';
      await Promise.all(tareas.slice(i, i + 4).map((t) => apiPost('guardarLead', t)));
    }
    CONTROL.estado = 'guardado';
    CONTROL.guardadoMulti = m.dias.length + ' días (' + fechaCorta(m.dias[0]) + ' al ' + fechaCorta(m.dias[m.dias.length - 1]) + ') de ' + ags.length + ' agentes';
    MES = m.dias[0].slice(0, 7);
    await refrescar();
    window.scrollTo(0, 0);
  } catch (e) {
    CONTROL.estado = 'error'; CONTROL.error = 'No se guardaron todos los días: ' + e.message + ' Probá guardar de nuevo (lo ya guardado se reemplaza, no se duplica).';
    render();
  }
}

async function leerControl() {
  CONTROL.estado = 'leyendo'; CONTROL.error = ''; CONTROL.multi = null; CONTROL.guardadoMulti = '';
  render();
  const varios = diasHabilesDelArchivo();
  if (varios.length > 1) {
    try { await leerVariosDias(varios); render(); window.scrollTo(0, 0); }
    catch (e) { CONTROL.multi = null; CONTROL.estado = 'error'; CONTROL.error = 'No se pudo importar ' + CONTROL.archivo + ': ' + e.message; render(); }
    return;
  }
  try {
    CONTROL.res = await apiPost('leerVtiger', { texto: CONTROL.textos[0], fecha: CONTROL.fecha, ahora: ahoraControl() });
    CONTROL.guardado = false;
    CONTROL.estado = 'importado';
    // Si ese día ya estaba guardado, se recupera la "Tarea al día" cargada.
    CONTROL.tareas = {};
    CONTROL.res.agentes.forEach((a) => { const d = leadExistente(CONTROL.fecha, a.nombre); if (d && (d.tarea === true || d.tarea === false)) CONTROL.tareas[a.nombre] = d.tarea; });
    render();
    window.scrollTo(0, 0);
  } catch (e) {
    CONTROL.res = null;
    CONTROL.estado = 'error'; CONTROL.error = 'No se pudo importar ' + CONTROL.archivo + ': ' + e.message;
    render();
  }
}

async function guardarControl() {
  const faltan = CONTROL.res.agentes.filter((a) => CONTROL.tareas[a.nombre] === undefined).map((a) => a.nombre.split(' ')[0]);
  if (faltan.length) { toast('Falta marcar "Tarea al día" de: ' + faltan.join(', '), true); return; }
  const btn = $('ctlGuardar');
  btn.disabled = true;
  btn.textContent = 'Guardando…';
  try {
    await apiPost('guardarControlLeads', { texto: CONTROL.textos[0], fecha: CONTROL.fecha, ahora: ahoraControl(), tareas: CONTROL.tareas });
    CONTROL.guardado = true;
    CONTROL.estado = 'guardado';
    MES = CONTROL.fecha.slice(0, 7);
    await refrescar();
    window.scrollTo(0, 0);
  } catch (e) {
    CONTROL.estado = 'error'; CONTROL.error = 'No se guardó el control: ' + e.message + ' Lo importado sigue en pantalla, probá guardar de nuevo.';
    render();
    window.scrollTo(0, 0);
  }
}

function copiarTexto(txt) {
  const ok = () => toast('Mensaje copiado');
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(ok, () => copiarViejo(txt)); return; }
  copiarViejo(txt);
}
function copiarViejo(txt) {
  const t = document.createElement('textarea');
  t.value = txt; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); toast('Mensaje copiado'); } catch (e) { toast('No se pudo copiar', true); }
  t.remove();
}

    porExt.map((ag) => {
      const a = porNombre(ag.nombre), C = a ? a.llamadas : null;

// ============================================================================
// CAMPAÑAS DESDE LA TORRE DE CONTROL
// Se leen las planillas de campaña del mes y los reportes de salientes de 3CX que la Torre ya recibe
// por mail. Una ganada ("Agendado") cuenta solo si el agente tiene una llamada ATENDIDA a ese teléfono
// en el mes. Quien gestionó todos los clientes de su planilla suma un bonus (hasta 5, tope 15).
// La clave de la Torre se toma de este navegador (misma web: novedadesgrupofiancar.github.io).
// ============================================================================
const TORRE_URL = 'https://script.google.com/macros/s/AKfycbzpWQHAJPTU1KoQt1agvpaxFcrNTYhiX0oBDRsLL9yktEY1O6aNm9PQ7yFzhZ-_uGCJ/exec';
const CAMP = { mes: '', estado: '', error: '', res: null, torre: null, extras: [], extrasNombres: [] };

async function torreApi(accion, datos) {
  let clave = '';
  try { clave = localStorage.getItem('torre-clave-acceso') || ''; } catch (e) {}
  if (!clave) throw new Error('este navegador no tiene la clave de la Torre de control. Entrá una vez a la Torre (novedadesgrupofiancar.github.io/torre-de-control) en este mismo navegador y volvé a probar.');
  const corte = new AbortController();
  const reloj = setTimeout(() => corte.abort(), 120000);
  let r;
  try {
    r = await fetch(TORRE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: accion, claveAcceso: clave, datos: datos || {} }), signal: corte.signal });
    r = await r.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'la Torre de control no respondió en 2 minutos.' : 'no hay conexión con la Torre de control (' + e.message + ').');
  } finally { clearTimeout(reloj); }
  if (!r.ok) throw new Error(r.codigo === 'CLAVE_INVALIDA' ? 'la clave de la Torre guardada en este navegador ya no sirve: entrá a la Torre de nuevo.' : (r.error || 'error de la Torre de control.'));
  return r.datos;
}

const ult8 = (t) => { const d = String(t || '').replace(/\D/g, ''); return d.length >= 8 ? d.slice(-8) : ''; };

/** Llamadas salientes {interno, numero, atendida, fecha} de los CSV de 3CX (formato "From/To" o "outbound_calls"). */
function llamadasSalientes(textos) {
  const llamadas = [], vistas = {};
  textos.forEach((texto) => {
    const filas = leerCsvSimple(texto);
    const enc = (filas[0] || []).map((h) => h.trim().toLowerCase());
    const c = (n) => enc.indexOf(n);
    const cFrom = c('from'), cTo = c('to'), cCaller = c('caller id'), cNom = c('caller display name'), cDest = c('destination callee id'), cStatus = c('status'), cTime = c('call time');
    filas.slice(1).forEach((f) => {
      const firma = f.join('|');
      if (vistas[firma]) return;
      vistas[firma] = true;
      let interno = '', numero = '';
      if (cFrom >= 0 && cTo >= 0) { interno = ((f[cFrom] || '').match(/\((\d{3,5})\)\s*$/) || [])[1] || ''; numero = ult8(f[cTo]); }
      else if (cCaller >= 0) {
        interno = /^\d{3,5}$/.test((f[cCaller] || '').trim()) ? f[cCaller].trim() : (((f[cNom] || '').match(/\((\d{3,5})\)\s*$/) || [])[1] || '');
        numero = ult8(cDest >= 0 ? f[cDest] : '');
      }
      if (!interno || !numero) return;
      llamadas.push({ interno: interno, numero: numero, atendida: String(f[cStatus] || '').trim().toLowerCase() === 'answered', fecha: String(cTime >= 0 ? f[cTime] || '' : '').replace('T', ' ') });
    });
  });
  return llamadas;
}

function leerCsvSimple(texto) {
  texto = String(texto || '').replace(/^﻿/, '');
  const filas = []; let fila = [], cur = '', q = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (q) { if (ch === '"' && texto[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { fila.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && texto[i + 1] === '\n') i++; fila.push(cur); cur = ''; if (fila.some((x) => x !== '')) filas.push(fila); fila = []; }
    else cur += ch;
  }
  fila.push(cur); if (fila.some((x) => x !== '')) filas.push(fila);
  return filas;
}

/** Cruza las planillas con las llamadas. Devuelve, por agente de Liga CX, lo necesario para el puntaje. */
function resumirCampania(filas, agentesTorre, llamadas, mes) {
  const torrePorNombre = {};
  (agentesTorre || []).forEach((a) => { torrePorNombre[sinTildes(a.nombre)] = a; });
  const ligaPorExt = {}, ligaPorNombre = {};
  RESP.equipo.agentes.forEach((a) => { ligaPorExt[a.ext] = a; ligaPorNombre[sinTildes(a.nombre)] = a; });
  // Agente de Liga CX a partir del nombre de la planilla: por interno de la Torre, o por nombre y apellido.
  const deLiga = (nombre) => {
    const n = sinTildes(nombre);
    const t = torrePorNombre[n];
    if (t && ligaPorExt[t.interno]) return { ag: ligaPorExt[t.interno], interno: t.interno };
    const p = n.split(' ');
    const a = ligaPorNombre[n] || RESP.equipo.agentes.filter((x) => { const q = sinTildes(x.nombre).split(' '); return q[0] === p[0] && (!p[1] || !q[1] || q[1].slice(0, 4) === p[1].slice(0, 4)); })[0];
    return a ? { ag: a, interno: (t && t.interno) || a.ext } : null;
  };
  const atendidas = {};
  llamadas.forEach((l) => { if (l.atendida && (!l.fecha || l.fecha.slice(0, 7) === mes)) atendidas[l.interno + '|' + l.numero] = true; });
  const res = {}, sinMapear = {};
  filas.forEach((f) => {
    const m = deLiga(f.agente);
    if (!m) { if (f.agente) sinMapear[f.agente] = true; return; }
    const r = res[m.ag.nombre] = res[m.ag.nombre] || { nombre: m.ag.nombre, asignadas: 0, gestionadas: 0, ganadas: 0, respaldadas: 0, sinRespaldo: [] };
    r.asignadas++;
    if (f.oportunidad) r.gestionadas++;
    if (f.oportunidad === 'Agendado') {
      r.ganadas++;
      const nums = [ult8(f.telefono), ult8(f.telefono_alternativo)].filter(Boolean);
      if (nums.some((n) => atendidas[m.interno + '|' + n])) r.respaldadas++;
      else r.sinRespaldo.push((f.cliente || 'sin nombre') + ' (' + (f.telefono || 'sin teléfono') + ', ' + f.hoja + ')');
    }
  });
  Object.keys(res).forEach((k) => { const r = res[k]; r.todas = r.asignadas > 0 && r.gestionadas === r.asignadas; });
  return { porAgente: res, sinMapear: Object.keys(sinMapear), llamadas: llamadas.length };
}

/** Vuelve a cruzar con lo traído de la Torre + los CSV de salientes que sumaste a mano. */
function recalcularCampania() {
  const T = CAMP.torre;
  if (!T) return;
  const r = resumirCampania(T.filas, T.agentes, llamadasSalientes(T.textos.concat(CAMP.extras)), CAMP.mes);
  r.dias3cx = T.dias.length; r.diasTorre = T.dias.slice().sort(); r.extras = CAMP.extrasNombres.slice();
  CAMP.res = r;
}

async function sumarSalientesCampania(ev) {
  const files = Array.from(ev.target.files);
  if (!files.length) return;
  const textos = await Promise.all(files.map((f) => f.text()));
  CAMP.extras = CAMP.extras.concat(textos); CAMP.extrasNombres = CAMP.extrasNombres.concat(files.map((f) => f.name));
  recalcularCampania();
  render();
}

async function traerCampaniasTorre() {
  const mes = mesDeCarga();
  if (CAMP.mes !== mes) { CAMP.extras = []; CAMP.extrasNombres = []; }
  Object.assign(CAMP, { mes: mes, estado: 'leyendo', error: '', res: null, torre: null });
  render();
  try {
    const hasta = mes + '-' + String(new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0).getDate()).padStart(2, '0');
    const [config, campania, reportes] = await Promise.all([
      torreApi('obtenerConfiguracion', {}),
      torreApi('leerCampania', { mes: mes }),
      torreApi('reportes3CXDelPeriodo', { desde: mes + '-01', hasta: hasta < hoyISO() ? hasta : hoyISO(), tipos: ['salientes'] })
    ]);
    CAMP.torre = { filas: campania.filas || [], agentes: config.agentes || [], textos: (reportes.archivos || []).map((a) => a.texto), dias: (reportes.archivos || []).map((a) => a.fecha_datos) };
    recalcularCampania();
    CAMP.estado = 'listo';
  } catch (e) {
    Object.assign(CAMP, { estado: 'error', error: e.message });
  }
  render();
}

function tarjetaCampanias(etiqueta, porNom, porNombre) {
  const r = CAMP.mes === mesDeCarga() ? CAMP.res : null;
  let aviso = '';
  if (CAMP.estado === 'leyendo') aviso = '<div class="aviso info"><span class="aviso-i">⏳</span><div><b>Leyendo la Torre de control…</b><div>Planillas de campaña y salientes de 3CX del mes. Puede tardar hasta un minuto.</div></div></div>';
  else if (CAMP.estado === 'error') aviso = '<div class="aviso mal"><span class="aviso-i">✗</span><div><b>No se pudo traer de la Torre</b><div>' + esc(CAMP.error) + '</div></div></div>';
  else if (r) aviso = '<div class="aviso bien"><span class="aviso-i">✓</span><div><b>Traído de la Torre de control</b><div>' + r.llamadas + ' llamadas salientes: ' + (r.dias3cx ? r.dias3cx + ' días por mail en la Torre (' + esc(fechaCorta(r.diasTorre[0])) + ' al ' + esc(fechaCorta(r.diasTorre[r.diasTorre.length - 1])) + ')' : 'ningún día por mail en la Torre') + (r.extras.length ? ' + ' + esc(r.extras.join(', ')) : '') + '. Revisá la tabla y tocá <b>Guardar campañas</b>.' +
    (!r.extras.length && (!r.dias3cx || r.diasTorre[0] > CAMP.mes + '-01') ? '<div class="aviso-extra">⚠ La Torre no tiene las salientes de todo el mes' + (r.dias3cx ? ' (arrancan el ' + esc(fechaCorta(r.diasTorre[0])) + ')' : '') + ': las ganadas de los otros días no van a tener respaldo. Sumá el CSV de salientes de 3CX del mes (outbound_calls) con el botón de arriba.</div>' : '') +
    (r.sinMapear.length ? '<div class="aviso-extra">⚠ Agentes de las planillas que no son de tus 6: ' + esc(r.sinMapear.join(', ')) + ' (se ignoran).</div>' : '') + '</div></div></div>';
  let h = '<div class="h-sec">Campañas · ' + esc(etiqueta) + '</div><div class="card"><div class="sub">Cuentan solo las ganadas (Agendado) con una llamada <b>atendida</b> en 3CX a ese cliente. Quien gestionó todos los clientes de su planilla suma hasta 5 puntos más (tope 15).</div>' +
    '<div class="acciones"><button class="btn pri" type="button" id="btnTorre">Traer de Torre de control</button>' + (r ? '<span class="btn file">Sumar salientes de 3CX (CSV)<input type="file" accept=".csv,text/csv" id="campSalientes" multiple></span>' : '') + '</div>' + aviso +
    '<form id="fCamp"><div class="scroll"><table class="t" style="margin-top:10px"><thead><tr><th>Agente</th><th class="r">Asignadas</th><th class="r">Gestionadas</th><th class="r">Ganadas</th><th class="r">Con respaldo</th><th>Gestionó todas</th></tr></thead><tbody>' +
    porNom.map((ag) => {
      if (!ag.campanas) return '<tr><td class="txt">' + esc(ag.nombre) + '</td><td colspan="5" class="muted">Recepción · 15 fijos</td></tr>';
      const a = porNombre(ag.nombre), t = r && r.porAgente[ag.nombre];
      const val = t ? t.respaldadas : (a && a.campanas.cargado ? a.campanas.ganadas : '');
      const todas = t ? t.todas : !!(a && a.campanas.gestionoTodas);
      return '<tr data-camp="' + esc(ag.nombre) + '"' + (t ? ' data-sinresp="' + t.sinRespaldo.length + '" data-detalle="' + esc(t.ganadas + ' ganadas, ' + t.respaldadas + ' con respaldo; ' + t.gestionadas + '/' + t.asignadas + ' gestionadas') + '"' : '') + '><td class="txt"><b>' + esc(ag.nombre) + '</b>' +
        (t && t.sinRespaldo.length ? '<details><summary class="nota" style="cursor:pointer">' + t.sinRespaldo.length + ' sin respaldo</summary><div class="nota">' + t.sinRespaldo.map(esc).join('<br>') + '</div></details>' : '') + '</td>' +
        '<td class="r">' + (t ? t.asignadas : '—') + '</td><td class="r">' + (t ? t.gestionadas : '—') + '</td><td class="r">' + (t ? t.ganadas : '—') + '</td>' +
        '<td class="r"><input class="inp sm" type="number" min="0" step="1" inputmode="numeric" name="ganadas" value="' + val + '" style="width:80px;text-align:right"></td>' +
        '<td><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" name="todas"' + (todas ? ' checked' : '') + '> ' + (t ? (t.todas ? 'Sí' : 'No (' + (t.asignadas - t.gestionadas) + ' sin gestionar)') : '') + '</label></td></tr>';
    }).join('') +
    '</tbody></table></div><div class="acciones" style="margin-top:10px"><button class="btn pri" type="submit">Guardar campañas</button></div></form></div>';
  return h;
}

function guardarCampaniasForm(fc) {
  const valores = {}, todas = {}, sinRespaldo = {}, detalle = {};
  fc.querySelectorAll('tr[data-camp]').forEach((tr) => {
    const n = tr.dataset.camp, v = tr.querySelector('input[name=ganadas]').value;
    if (v === '') return;
    valores[n] = Number(v);
    todas[n] = tr.querySelector('input[name=todas]').checked;
    if (tr.dataset.sinresp !== undefined) { sinRespaldo[n] = Number(tr.dataset.sinresp); detalle[n] = tr.dataset.detalle; }
  });
  guardar(fc.querySelector('button[type=submit]'), 'guardarCampanas', { mes: mesDeCarga(), valores: valores, todas: todas, sinRespaldo: sinRespaldo, detalle: detalle }, 'Campañas guardadas');
}

function avisosHtml() {
  const av = RESP.avisos || [];
  return '<div class="h-sec">Avisos de la planilla</div><div class="card">' +
    (av.length ? '<ul class="avisos">' + av.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '<p class="nota">Sin avisos: todas las filas se leyeron bien.</p>') + '</div>';
}

function prepararCarga() {
  const f = $('fLead');
  if (f) {
    const actualizar = () => { FORM.fecha = $('lFecha').value; FORM.agente = $('lAgente').value; precargarLead(); };
    $('lFecha').addEventListener('change', actualizar);
    $('lAgente').addEventListener('change', actualizar);
    ['lTot', 'lSin', 'lErr'].forEach((id) => $(id).addEventListener('input', previewLead));
    document.querySelectorAll('.lChk').forEach((c) => c.addEventListener('change', () => {
      $('lErr').value = document.querySelectorAll('.lChk:checked').length; previewLead();
    }));
    $('lTarea').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (b) { FORM.tarea = b.dataset.v === '1'; pintarTarea(); } });
    f.addEventListener('submit', (ev) => { ev.preventDefault(); guardarLead(); });
    $('lBorrar').addEventListener('click', borrarLead);
    FORM.agente = $('lAgente').value;
    precargarLead();
  }
  $('mesCarga').addEventListener('change', (ev) => {
    if (!/^\d{4}-\d{2}$/.test(ev.target.value)) return;
    CARGA_MES = ev.target.value;
    MSG_LLAMADAS = '';
    if (RESP.datos[CARGA_MES]) MES = CARGA_MES;
    render();
  });
  const fm = $('fMes');
  if (fm) fm.addEventListener('submit', (ev) => { ev.preventDefault(); guardar(fm.querySelector('button'), 'guardarMes', { mes: mesDeCarga(), diasHabiles: $('mDias').value }, 'Días hábiles guardados'); });
  const csvIn = $('csvIn'), csvOut = $('csvOut');
  if (csvIn) csvIn.addEventListener('change', (ev) => importarCsv(ev, 'entrantes'));
  if (csvOut) csvOut.addEventListener('change', (ev) => importarCsv(ev, 'salientes'));
  const bl = $('btnLlamadas');
  if (bl) bl.addEventListener('click', guardarLlamadas);
  const fc = $('fCamp');
  if (fc) fc.addEventListener('submit', (ev) => { ev.preventDefault(); guardarCampaniasForm(fc); });
  const bt = $('btnTorre');
  if (bt) bt.addEventListener('click', traerCampaniasTorre);
  const cs = $('campSalientes');
  if (cs) cs.addEventListener('change', sumarSalientesCampania);
}

function leadExistente(fecha, agente) {
  const dm = RESP.datos[(fecha || '').slice(0, 7)];
  if (!dm || !dm.agentes) return null;
  const a = dm.agentes.filter((x) => x.nombre === agente)[0];
  return a ? a.leads.dias.filter((d) => d.fecha === fecha)[0] || null : null;
}

function precargarLead() {
  const d = leadExistente(FORM.fecha, FORM.agente);
  $('lTot').value = d ? d.totales : '';
  $('lSin').value = d ? d.sinGestionar : 0;
  $('lErr').value = d ? d.errores : 0;
  FORM.tarea = d ? d.tarea !== false : true;
  document.querySelectorAll('.lChk').forEach((c) => { c.checked = false; });
  $('lBorrar').hidden = !d;
  pintarTarea();
  previewLead(d);
}

function pintarTarea() {
  $('lTarea').querySelectorAll('button').forEach((b) => b.classList.toggle('on', (b.dataset.v === '1') === FORM.tarea));
}

function previewLead(existente) {
  const tot = $('lTot').value, sin = Number($('lSin').value || 0), err = Number($('lErr').value || 0);
  const prev = $('lPrev');
  const d = existente && existente.fecha ? existente : leadExistente(FORM.fecha, FORM.agente);
  let msg = d ? 'Ya cargado: ' + d.totales + ' leads, ' + d.sinGestionar + ' sin gestionar, ' + d.errores + ' errores, tarea ' + (d.tarea ? 'SI' : 'NO') + ' → ' + (d.score === null ? 'no cuenta' : fmt(d.score, 2) + '/10') + '. Guardar lo reemplaza.' : 'Día nuevo para este agente.';
  if (tot !== '' && Number(tot) >= 0) {
    const gest = Number(tot) - sin;
    if (sin > Number(tot)) msg += '  ⚠ Sin gestionar no puede ser mayor que los totales.';
    else if (err > 8 || err < 0) msg += '  ⚠ Errores va de 0 a 8.';
    else msg += '  Gestionados: ' + gest + '.';
  }
  prev.textContent = msg;
}

async function guardarLead() {
  const tot = $('lTot').value;
  if (tot === '') { toast('Falta "Leads totales"', true); return; }
  const datos = { fecha: $('lFecha').value, agente: $('lAgente').value, totales: Number(tot), sinGestionar: Number($('lSin').value || 0), errores: Number($('lErr').value || 0), tareaAlDia: FORM.tarea };
  if (datos.sinGestionar > datos.totales) { toast('Sin gestionar no puede ser mayor que los totales', true); return; }
  if (datos.errores < 0 || datos.errores > 8) { toast('Errores va de 0 a 8', true); return; }
  const btn = $('lGuardar');
  btn.disabled = true;
  try {
    const r = await apiPost('guardarLead', datos);
    // Pasar al siguiente agente, misma fecha
    const nombres = RESP.equipo.agentes.map((a) => a.nombre);
    FORM.agente = nombres[(nombres.indexOf(datos.agente) + 1) % nombres.length];
    const mesLead = datos.fecha.slice(0, 7);
    if (MES !== mesLead) MES = mesLead;
    await refrescar();
    toast('Guardado ' + datos.agente.split(' ')[0] + ' · ' + fechaCorta(datos.fecha) + ' → ' + (r.scoreDia === null ? 'día sin leads (no cuenta)' : fmt(r.scoreDia, 2) + '/10'));
    setTimeout(() => { const t = $('lTot'); if (t) t.focus(); }, 0);
  } catch (e) { toast('No se guardó: ' + e.message, true); btn.disabled = false; }
}

async function borrarLead() {
  if (!confirm('¿Borrar el ' + fechaCorta(FORM.fecha) + ' de ' + FORM.agente + ' de la planilla?')) return;
  await guardar($('lBorrar'), 'borrarLead', { fecha: FORM.fecha, agente: FORM.agente }, 'Día borrado');
}

/** POST genérico + refresco. Devuelve true si salió bien. */
async function guardar(btn, accion, datos, ok) {
  if (btn) btn.disabled = true;
  try {
    await apiPost(accion, datos);
    await refrescar();
    toast(ok);
    return true;
  } catch (e) {
    toast('No se guardó: ' + e.message, true);
    if (btn) btn.disabled = false;
    return false;
  }
}

async function publicar(valor, mesPub) {
  const mes = mesPub || MES;
  const info = mesInfo(mes);
  const pub = valor === '1';
  if (!confirm(pub ? 'Publicar ' + info.etiqueta + ': el equipo lo va a ver y pasa a ser el mes que se muestra al entrar. ¿Confirmás?' : '¿Despublicar ' + info.etiqueta + '? El equipo deja de verlo.')) return;
  await guardar(null, 'guardarMes', { mes: mes, publicado: pub }, pub ? 'Publicado: ya lo ve el equipo' : 'Despublicado');
}

// ============================================================================
// IMPORTAR ARCHIVOS DE 3CX (llamadas)
// La web solo lee el archivo y lo manda: el Apps Script lo resume y lo guarda
// en el mes seleccionado (acción importarLlamadas).
// ============================================================================
function numeroCsv(s) { if (s == null || s === '') return null; const n = Number(String(s).replace('%', '').replace(',', '.').trim()); return isNaN(n) ? null : n; }
function segundosCsv(s) {
  if (!s) return null;
  const p = String(s).trim().split(':').map(Number);
  if (p.some(isNaN)) return numeroCsv(s);
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0];
}

let MSG_LLAMADAS = '';

function importarCsv(ev, tipo) {
  const input = ev.target, file = input.files[0];
  if (!file) return;
  const lector = new FileReader();
  lector.onload = async () => {
    $('csvMsg').textContent = 'Leyendo ' + file.name + '…';
    try {
      // Solo lee el archivo y llena la tabla. Se guarda con "Guardar datos importados".
      const r = await apiPost('leerLlamadas', { mes: mesDeCarga(), tipo: tipo, texto: lector.result });
      if (r.otroMes && !confirm(r.otroMes + ' ¿Usarlo igual?')) { $('csvMsg').textContent = 'Cancelado.'; return; }
      Object.keys(r.porAgente).forEach((nombre) => {
        const a = r.porAgente[nombre], tr = document.querySelector('tr[data-ag="' + cssEsc(nombre) + '"]');
        if (!tr) return;
        const set = (name, v) => { if (v === null || v === undefined) return; const i = tr.querySelector('input[name=' + name + ']'); i.value = v; i.style.borderColor = 'var(--accent)'; };
        if (tipo === 'entrantes') { set('pct', a.pct); set('tmo', a.tmo === null ? null : segTxt(a.tmo)); set('llamadas', a.llamadas); }
        else { set('tmoSal', a.tmo === null ? null : segTxt(a.tmo)); set('salientes', a.llamadas); }
      });
      const raros = r.ignorados.filter((g) => g.motivo !== 'no está en el ranking');
      $('csvMsg').textContent = file.name + ' importado. Falta guardar: tocá "Guardar datos importados" abajo.' +
        (raros.length ? ' ⚠ Ignorado: ' + raros.map((g) => g.texto + ' (' + g.motivo + ')').join('; ') + '.' : '');
    } catch (e) {
      $('csvMsg').textContent = '';
      toast('No se pudo leer el archivo: ' + e.message, true);
    }
  };
  lector.readAsText(file, 'UTF-8');
  input.value = '';
}
async function guardarLlamadas() {
  const ent = [], sal = [];
  let error = null;
  document.querySelectorAll('tr[data-ag]').forEach((tr) => {
    const v = (n) => tr.querySelector('input[name=' + n + ']').value.trim();
    const ag = tr.dataset.ag;
    const pct = v('pct') === '' ? null : numeroCsv(v('pct'));
    const tmo = v('tmo') === '' ? null : segundosCsv(v('tmo'));
    if ((v('pct') !== '' && (pct === null || pct < 0 || pct > 100)) || (v('tmo') !== '' && !tmo)) error = 'Revisá los valores de ' + ag;
    if (pct !== null || tmo !== null) ent.push({ agente: ag, pct: pct, tmo: tmo, llamadas: v('llamadas') === '' ? null : Number(v('llamadas')) });
    const tmoS = v('tmoSal') === '' ? null : segundosCsv(v('tmoSal'));
    if (tmoS !== null || v('salientes') !== '') sal.push({ agente: ag, tmo: tmoS, llamadas: v('salientes') === '' ? null : Number(v('salientes')) });
  });
  if (error) { toast(error, true); return; }
  const btn = $('btnLlamadas');
  btn.disabled = true;
  try {
    if (ent.length) await apiPost('guardarLlamadas', { mes: mesDeCarga(), tipo: 'entrantes', filas: ent });
    if (sal.length) await apiPost('guardarLlamadas', { mes: mesDeCarga(), tipo: 'salientes', filas: sal });
    MSG_LLAMADAS = '✓ Llamadas guardadas en la planilla.';
    await refrescar();
    toast('Llamadas guardadas en la planilla');
  } catch (e) { toast('No se guardó: ' + e.message, true); btn.disabled = false; }
}

// ============================================================================
// EXPORTAR PNG
// ============================================================================
async function exportarPng() {
  const btn = $('btnPng');
  btn.disabled = true;
  try {
    if (!window.html2canvas) {
      await new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = ok; s.onerror = () => mal(new Error('no se pudo cargar html2canvas')); document.head.appendChild(s); });
    }
    if (TAB !== 'ranking' && TAB !== 'especiales') { TAB = 'ranking'; render(); }
    const nodo = $('vistaMes');
    if (!nodo) throw new Error('No hay vista del mes para exportar.');
    const lienzo = await window.html2canvas(nodo, { backgroundColor: '#0a0a0f', scale: 2, windowWidth: 1280, onclone: (doc) => {
      const v = doc.getElementById('vistaMes');
      v.style.padding = '20px'; v.style.width = '1240px';
      v.querySelectorAll('button, .no-png').forEach((b) => b.remove());
      const t = doc.createElement('div');
      t.innerHTML = '<div style="font-family:DM Mono,monospace;font-size:11px;letter-spacing:2px;color:#e8c872;text-transform:uppercase">Liga CX · Grupo Fiancar</div>' +
        '<div style="font-size:22px;font-weight:600;margin:4px 0 14px">' + esc(mesInfo(MES).etiqueta) + (TAB === 'especiales' ? ' · Evaluación especial' : '') + '</div>';
      v.insertBefore(t, v.firstChild);
    } });
    const a = document.createElement('a');
    a.download = 'performance_' + MES + (TAB === 'especiales' ? '_especiales' : '') + '.png';
    a.href = lienzo.toDataURL('image/png');
    a.click();
    toast('PNG exportado');
  } catch (e) { toast('No se pudo exportar: ' + e.message, true); }
  btn.disabled = false;
}

// ============================================================================
// EVENTOS
// ============================================================================
$('selMes').addEventListener('change', (ev) => {
  MES = ev.target.value;
  const info = mesInfo(MES);
  if (info) { CARGA_MES = MES; MSG_LLAMADAS = ''; }
  render();
});
$('btnPng').addEventListener('click', exportarPng);
$('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('[data-tab]'); if (b) { TAB = b.dataset.tab; render(); window.scrollTo(0, 0); } });
$('main').addEventListener('click', (ev) => {
  const f = ev.target.closest('[data-ficha]');
  if (f) { abrirFicha(f.dataset.ficha); return; }
  const p = ev.target.closest('[data-accion="publicar"]');
  if (p) publicar(p.dataset.valor, p.dataset.mes);
});
$('capaModal').addEventListener('click', (ev) => { if (ev.target.dataset && ev.target.dataset.cerrar) cerrarFicha(); });
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') cerrarFicha(); });

// ============================================================================
// UTILIDADES
// ============================================================================
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }
function sinTildes(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function fmt(n, dec) { if (n === null || n === undefined) return '—'; return Number(n).toLocaleString('es-UY', { maximumFractionDigits: dec === undefined ? 1 : dec }); }
function segTxt(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function semaforoDe(t) { return t >= 80 ? 'verde' : t >= 66 ? 'amarillo' : 'rojo'; }
function hoyISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fechaCorta(iso) { const p = iso.split('-'); const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb']; return dias[new Date(+p[0], p[1] - 1, +p[2]).getDay()] + ' ' + p[2] + '/' + p[1]; }
function horaCorta(iso) { try { return new Date(iso).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
function setSync(txt, cls) { const c = $('chipSync'); c.textContent = txt; c.className = 'chip' + (cls ? ' ' + cls : ''); }
let toastT = null;
function toast(msg, err) {
  $('capaToast').innerHTML = '<div class="toast' + (err ? ' err' : '') + '" role="status">' + esc(msg) + '</div>';
  clearTimeout(toastT);
  toastT = setTimeout(() => { $('capaToast').innerHTML = ''; }, err ? 6000 : 3000);
}

iniciar();
</script>
